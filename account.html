<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GlobalTools — Meu painel</title><style>body{font-family:Arial,sans-serif;background:#0b0b0d;color:#fff;margin:0}.wrap{width:min(1180px,94vw);margin:32px auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:22px 0}.card{background:#151519;border:1px solid #333;border-radius:16px;padding:18px}.big{font-size:28px;font-weight:800}.muted{color:#aaa}button{padding:10px 14px;border-radius:9px;border:1px solid #555;background:#fff;color:#000;font-weight:700;cursor:pointer;margin:4px}.danger{background:#1a1a1f;color:#fff}.locked{opacity:.45}.row{display:flex;flex-wrap:wrap;gap:8px}.tx{width:100%;min-height:150px;background:#09090b;color:#fff;border:1px solid #333;border-radius:10px;padding:12px;box-sizing:border-box}#msg{min-height:22px;color:#8ee28e}.error{color:#ff8c8c!important}.loading{opacity:.8}</style></head><body><div class="wrap"><div class="top"><div><h1>GlobalTools Finance</h1><div id="who" class="muted loading">Validando seu acesso...</div></div><div><button id="upgrade">Upgrade</button><button id="logout" class="danger">Sair</button></div></div><div id="cards" class="grid"></div><div class="card"><h2>Dados financeiros</h2><p class="muted">Os dados ficam vinculados à sua conta. Você pode começar pelo histórico de transações.</p><textarea id="data" class="tx" placeholder='Ex.: [{"date":"2026-10-07","description":"Venda","type":"income","amount":1000}]'></textarea><div class="row"><button id="load">Carregar</button><button id="save">Salvar</button></div><div id="msg"></div></div><div class="card"><h2>Produtos liberados</h2><div id="products"></div></div></div><script>let ME=null;const $=id=>document.getElementById(id);async function api(u,o={}){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);try{const r=await fetch(u,{...o,credentials:"same-origin",cache:"no-store",signal:controller.signal});let j={};try{j=await r.json()}catch{}return{r,j}}catch(e){return{r:{ok:false,status:0},j:{ok:false,error:e.name==="AbortError"?"Tempo limite ao acessar o servidor.":"Falha de conexão com o servidor."}}}finally{clearTimeout(timer)}}function showError(message){$("who").textContent=message;$("who").className="muted error"}async function init(){const sid=new URLSearchParams(location.search).get("session_id");$("who").textContent=sid?"Confirmando sua compra e preparando o acesso...":"Validando seu acesso...";let x;if(sid){const activated=await api("/api/activate-session",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sid})});if(!activated.r.ok||!activated.j.ok){return showError(activated.j.error||"Não foi possível confirmar sua sessão. Volte à confirmação da compra e tente novamente.")}x=await api("/api/me")}else{x=await api("/api/me")}if(!x.j.authenticated){return showError(x.j.error||"Sua sessão não foi reconhecida. Acesse novamente pela confirmação da compra.")}ME=x.j.user;$("who").textContent=ME.email+" • Plano "+ME.planLabel;$("who").className="muted";$("cards").innerHTML=Object.entries(ME.permissions).map(([k,v])=>"<div class='card "+(v?"":"locked")+"'><div class='muted'>"+k+"</div><div class='big'>"+(v?"✓":"🔒")+"</div></div>").join("");$("products").innerHTML=ME.products.map(p=>"<div class='row'><span>"+p+"</span><button onclick=\"location.href='/api/download-product?product="+encodeURIComponent(p)+"'\">Baixar Excel</button></div>").join("");const d=await api("/api/finance/data");if(d.j.data)$("data").value=JSON.stringify(d.j.data,null,2);else if(!d.r.ok)$("msg").textContent=d.j.error||"Não foi possível carregar os dados."}$("logout").onclick=async()=>{await api("/api/logout",{method:"POST"});location.href="/login.html"};$("load").onclick=async()=>{const d=await api("/api/finance/data");if(d.j.data){$("data").value=JSON.stringify(d.j.data,null,2);$("msg").textContent="Dados carregados."}else $("msg").textContent=d.j.error||"Erro ao carregar."};$("save").onclick=async()=>{try{const parsed=JSON.parse($("data").value);const d=await api("/api/finance/data",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:parsed})});$("msg").textContent=d.r.ok?"Dados salvos.":(d.j.error||"Erro ao salvar.")}catch{$("msg").textContent="JSON inválido."}};$("upgrade").onclick=async()=>{const plan=prompt("Digite o plano: business ou unlimited");if(!plan)return;const x=await api("/api/upgrade",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({plan})});if(x.j.url)location.href=x.j.url;else alert(x.j.error||"Não foi possível iniciar o upgrade.")};init();</script></body></html>
