<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oolivo Finance — Entrar</title><style>body{font-family:Arial,sans-serif;background:#0b0b0d;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.box{width:min(420px,90vw);background:#151519;border:1px solid #333;border-radius:18px;padding:28px;box-sizing:border-box}h1{margin-top:0}input,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #444;background:#0d0d10;color:#fff}button{background:#fff;color:#000;font-weight:700;cursor:pointer}.muted{color:#aaa;font-size:14px}#msg{min-height:20px;color:#ff7777}</style></head><body><main class="box"><h1>Oolivo Finance</h1><p>Entre no seu painel financeiro.</p><form id="f"><input id="email" type="email" placeholder="E-mail" required><input id="password" type="password" placeholder="Senha" required><button>Entrar</button></form><p id="msg"></p><p class="muted">Comprou uma planilha? Use o acesso criado na confirmação da compra.</p></main><script>f.onsubmit=async e=>{e.preventDefault();msg.textContent="Entrando...";const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});const j=await r.json();if(r.ok){location.href="/account.html"}else msg.textContent=j.error||"Não foi possível entrar."}</script></body></html>
