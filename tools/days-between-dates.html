<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de Dias entre Datas | Oolivo</title><meta name="description" content="Calcule quantos dias existem entre duas datas com a calculadora online da Oolivo."><meta name="robots" content="index,follow"><link rel="canonical" href="https://oolivo.com.br/tools/days-between-dates.html"><link rel="stylesheet" href="/styles.css"></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">O</span><span>Oolivo</span></a><nav><a href="/">Ferramentas</a></nav></header><main class="tool-page"><div class="breadcrumbs"><a href="/">Início</a> / Dias entre Datas</div><h1>Calculadora de Dias entre Datas</h1><p class="intro">Descubra a quantidade de dias corridos entre duas datas.</p><div class="tool-box"><label>Data inicial <input type="date" id="start"></label><label>Data final <input type="date" id="end"></label><button class="btn" onclick="run()">Calcular diferença</button><div id="result" class="result">O resultado aparecerá aqui.</div></div><section class="info"><h2>Sobre esta ferramenta</h2><p>O cálculo considera a diferença entre as datas e não inclui ambos os dias como contagem inclusiva.</p></section></main><script>function run(){const a=document.getElementById('start').value,b=document.getElementById('end').value;const out=document.getElementById('result');if(!a||!b){out.textContent='Selecione as duas datas.';return;}out.textContent='Diferença: '+Math.abs(Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000))+' dia(s).'}</script></body></html>
