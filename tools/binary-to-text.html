<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversor de Binário para Texto | Oolivo</title><meta name="description" content="Converta sequências binárias em texto legível com a ferramenta online gratuita da Oolivo."><meta name="robots" content="index,follow"><link rel="canonical" href="https://oolivo.com.br/tools/binary-to-text.html"><link rel="stylesheet" href="/styles.css"></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">O</span><span>Oolivo</span></a><nav><a href="/">Ferramentas</a><a href="/privacy.html">Privacidade</a></nav></header><main class="tool-page"><div class="breadcrumbs"><a href="/">Início</a> / Binário para Texto</div><h1>Conversor de Binário para Texto</h1><p class="intro">Converta bytes binários em texto legível.</p><div class="tool-box"><textarea id="input" placeholder="01001000 01101001" aria-label="Sequência binária"></textarea><button id="action" class="btn">Converter para texto</button><div id="result" class="result"></div></div><script>action.onclick=()=>{try{result.textContent=input.value.trim().split(/\\s+/).map(x=>String.fromCharCode(parseInt(x,2))).join('')}catch(e){result.textContent='Entrada binária inválida. Use grupos de 8 bits separados por espaços.'}}</script><section class="info"><h2>Sobre esta ferramenta</h2><p>Converta grupos binários em caracteres de texto. Informe os bits em grupos separados por espaços, por exemplo: 01001000 01101001.</p></section></main></body></html>
