<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de Raiz Quadrada | Oolivo</title><meta name="description" content="Calcule a raiz quadrada de números reais com a calculadora online gratuita da Oolivo."><meta name="robots" content="index,follow"><link rel="canonical" href="https://oolivo.com.br/tools/square-root-calculator.html"><link rel="stylesheet" href="/styles.css"></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">O</span><span>Oolivo</span></a><nav><a href="/">Ferramentas</a></nav></header><main class="tool-page"><div class="breadcrumbs"><a href="/">Início</a> / Raiz Quadrada</div><h1>Calculadora de Raiz Quadrada</h1><p class="intro">Informe um número para calcular sua raiz quadrada.</p><div class="tool-box"><label>Número <input type="number" id="num" min="0" step="any" value="25"></label><button class="btn" onclick="run()">Calcular raiz</button><div id="result" class="result">O resultado aparecerá aqui.</div></div><section class="info"><h2>Sobre esta ferramenta</h2><p>A raiz quadrada de um número não negativo é o valor que, multiplicado por si mesmo, produz o número original.</p></section></main><script>function run(){const n=Number(document.getElementById('num').value),out=document.getElementById('result');if(!Number.isFinite(n)||n<0){out.textContent='Informe um número real não negativo.';return;}out.textContent='Raiz quadrada: '+Math.sqrt(n).toLocaleString('pt-BR',{maximumFractionDigits:12})}</script></body></html>
