<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerador de Números Aleatórios | Oolivo</title><meta name="description" content="Gere um número inteiro aleatório entre dois limites com a ferramenta gratuita da Oolivo."><meta name="robots" content="index,follow"><link rel="canonical" href="https://oolivo.com.br/tools/random-number-generator.html"><link rel="stylesheet" href="/styles.css"></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">O</span><span>Oolivo</span></a><nav><a href="/">Ferramentas</a></nav></header><main class="tool-page"><div class="breadcrumbs"><a href="/">Início</a> / Gerador de Números Aleatórios</div><h1>Gerador de Números Aleatórios</h1><p class="intro">Gere um número inteiro aleatório entre um limite mínimo e máximo.</p><div class="tool-box"><label>Mínimo <input id="min" type="number" value="1"></label><label>Máximo <input id="max" type="number" value="100"></label><button id="action" class="btn">Gerar número</button><div id="result" class="result">O resultado aparecerá aqui.</div></div><section class="info"><h2>Sobre esta ferramenta</h2><p>Informe o intervalo desejado. Os limites são incluídos no resultado.</p></section></main><script>document.getElementById('action').onclick=()=>{let a=Number(document.getElementById('min').value),b=Number(document.getElementById('max').value),o=document.getElementById('result');if(!Number.isInteger(a)||!Number.isInteger(b)){o.textContent='Informe limites inteiros válidos.';return;}if(a>b)[a,b]=[b,a];o.textContent=String(Math.floor(Math.random()*(b-a+1))+a)}</script></body></html>
