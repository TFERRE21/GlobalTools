<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adicionar ou Subtrair Dias de uma Data | Oolivo</title><meta name="description" content="Calcule uma data futura ou passada adicionando ou subtraindo dias com a ferramenta da Oolivo."><meta name="robots" content="index,follow"><link rel="canonical" href="https://oolivo.com.br/tools/date-add-subtract.html"><link rel="stylesheet" href="/styles.css"></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">O</span><span>Oolivo</span></a><nav><a href="/">Ferramentas</a></nav></header><main class="tool-page"><div class="breadcrumbs"><a href="/">Início</a> / Calcular Data</div><h1>Adicionar ou Subtrair Dias</h1><p class="intro">Informe uma data e a quantidade de dias para calcular a nova data.</p><div class="tool-box"><label>Data inicial <input type="date" id="date"></label><label>Dias (use negativo para subtrair) <input type="number" id="days" value="0"></label><button class="btn" onclick="run()">Calcular data</button><div id="result" class="result">O resultado aparecerá aqui.</div></div><section class="info"><h2>Sobre esta ferramenta</h2><p>Calcule datas somando ou subtraindo dias corridos. O resultado usa a data local do navegador.</p></section></main><script>function run(){const v=document.getElementById('date').value;const n=Number(document.getElementById('days').value);const out=document.getElementById('result');if(!v||!Number.isFinite(n)){out.textContent='Informe uma data e um número de dias válido.';return;}const d=new Date(v+'T12:00:00');d.setDate(d.getDate()+n);out.textContent='Nova data: '+d.toLocaleDateString('pt-BR')}</script></body></html>
