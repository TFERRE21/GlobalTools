<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escolhedor Aleatório Online | Oolivo</title><meta name="description" content="Escolha um item aleatório de uma lista com a ferramenta gratuita da Oolivo."><meta name="robots" content="index,follow"><link rel="canonical" href="https://oolivo.com.br/tools/random-choice-picker.html"><link rel="stylesheet" href="/styles.css"></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">O</span><span>Oolivo</span></a><nav><a href="/">Ferramentas</a></nav></header><main class="tool-page"><div class="breadcrumbs"><a href="/">Início</a> / Escolha Aleatória</div><h1>Escolhedor Aleatório</h1><p class="intro">Digite uma opção por linha e deixe a ferramenta escolher uma delas.</p><div class="tool-box"><textarea id="input" placeholder="Opção 1\nOpção 2\nOpção 3"></textarea><button class="btn" onclick="run()">Escolher opção</button><div id="result" class="result">A opção escolhida aparecerá aqui.</div></div><section class="info"><h2>Sobre esta ferramenta</h2><p>Útil para sorteios informais, decisões simples e seleção aleatória entre opções fornecidas.</p></section></main><script>function run(){const a=document.getElementById('input').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);document.getElementById('result').textContent=a.length?a[Math.floor(Math.random()*a.length)]:'Digite pelo menos uma opção.'}</script></body></html>
