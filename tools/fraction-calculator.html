<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de Frações Online | Oolivo</title><meta name="description" content="Some, subtraia, multiplique e divida frações com a calculadora online da Oolivo."><meta name="robots" content="index,follow"><link rel="canonical" href="https://oolivo.com.br/tools/fraction-calculator.html"><link rel="stylesheet" href="/styles.css"></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">O</span><span>Oolivo</span></a><nav><a href="/">Ferramentas</a></nav></header><main class="tool-page"><div class="breadcrumbs"><a href="/">Início</a> / Calculadora de Frações</div><h1>Calculadora de Frações</h1><p class="intro">Calcule a soma, subtração, multiplicação ou divisão de duas frações.</p><div class="tool-box"><label>Numerador 1 <input type="number" id="n1" value="1"></label><label>Denominador 1 <input type="number" id="d1" value="2"></label><label>Operação <select id="op"><option value="+">Somar (+)</option><option value="-">Subtrair (−)</option><option value="*">Multiplicar (×)</option><option value="/">Dividir (÷)</option></select></label><label>Numerador 2 <input type="number" id="n2" value="1"></label><label>Denominador 2 <input type="number" id="d2" value="3"></label><button class="btn" onclick="run()">Calcular fração</button><div id="result" class="result">O resultado aparecerá aqui.</div></div><section class="info"><h2>Sobre esta ferramenta</h2><p>Calcule operações básicas entre duas frações. O resultado é apresentado como fração e decimal.</p></section></main><script>function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1}function run(){const n1=Number(document.getElementById('n1').value),d1=Number(document.getElementById('d1').value),n2=Number(document.getElementById('n2').value),d2=Number(document.getElementById('d2').value),op=document.getElementById('op').value,out=document.getElementById('result');if(![n1,d1,n2,d2].every(Number.isInteger)||d1===0||d2===0||(op==='/'&&n2===0)){out.textContent='Verifique os numeradores e denominadores; denominadores não podem ser zero.';return;}let n,d;if(op==='+'){n=n1*d2+n2*d1;d=d1*d2}else if(op==='-'){n=n1*d2-n2*d1;d=d1*d2}else if(op==='*'){n=n1*n2;d=d1*d2}else{n=n1*d2;d=d1*n2}if(d<0){n=-n;d=-d}const g=gcd(n,d);n/=g;d/=g;out.textContent='Resultado: '+n+'/'+d+'\nDecimal: '+(n/d).toLocaleString('pt-BR',{maximumFractionDigits:10})}</script></body></html>
