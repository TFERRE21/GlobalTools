<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora Binária Online | Oolivo</title><meta name="description" content="Converta e opere com números binários usando a calculadora gratuita da Oolivo."><meta name="robots" content="index,follow"><link rel="canonical" href="https://oolivo.com.br/tools/binary-calculator.html"><link rel="stylesheet" href="/styles.css"></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">O</span><span>Oolivo</span></a><nav><a href="/">Ferramentas</a></nav></header><main class="tool-page"><div class="breadcrumbs"><a href="/">Início</a> / Calculadora Binária</div><h1>Calculadora Binária</h1><p class="intro">Converta um número binário em decimal e hexadecimal.</p><div class="tool-box"><textarea id="input" placeholder="Digite um valor binário, por exemplo 101101"></textarea><button class="btn" onclick="run()">Converter número</button><div id="result" class="result">O resultado aparecerá aqui.</div></div><section class="info"><h2>Sobre esta ferramenta</h2><p>Use apenas os dígitos 0 e 1. A ferramenta mostra representações decimal e hexadecimal do valor informado.</p></section></main><script>function run(){const s=document.getElementById('input').value.trim();const out=document.getElementById('result');if(!/^[01]+$/.test(s)){out.textContent='Digite um número binário válido contendo apenas 0 e 1.';return;}const n=BigInt('0b'+s);out.textContent='Decimal: '+n.toString(10)+'\nHexadecimal: '+n.toString(16).toUpperCase();}</script></body></html>
