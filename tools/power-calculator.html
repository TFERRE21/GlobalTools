<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de Potências Online | Oolivo</title><meta name="description" content="Calcule potências e expoentes com a calculadora online gratuita da Oolivo."><meta name="robots" content="index,follow"><link rel="canonical" href="https://oolivo.com.br/tools/power-calculator.html"><link rel="stylesheet" href="/styles.css"></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">O</span><span>Oolivo</span></a><nav><a href="/">Ferramentas</a></nav></header><main class="tool-page"><div class="breadcrumbs"><a href="/">Início</a> / Calculadora de Potências</div><h1>Calculadora de Potências</h1><p class="intro">Calcule a base elevada a um expoente.</p><div class="tool-box"><label>Base <input type="number" id="base" step="any" value="2"></label><label>Expoente <input type="number" id="exp" step="1" value="8"></label><button class="btn" onclick="run()">Calcular potência</button><div id="result" class="result">O resultado aparecerá aqui.</div></div><section class="info"><h2>Sobre esta ferramenta</h2><p>Calcule potências usando uma base numérica e um expoente inteiro. Para expoentes negativos, o resultado pode ser fracionário.</p></section></main><script>function run(){const b=Number(document.getElementById('base').value),e=Number(document.getElementById('exp').value),out=document.getElementById('result');if(!Number.isFinite(b)||!Number.isInteger(e)||Math.abs(e)>10000){out.textContent='Informe uma base válida e um expoente inteiro entre -10000 e 10000.';return;}const n=Math.pow(b,e);out.textContent=Number.isFinite(n)?'Resultado: '+n.toLocaleString('pt-BR',{maximumFractionDigits:12}):'O resultado excede os limites numéricos do navegador.'}</script></body></html>
