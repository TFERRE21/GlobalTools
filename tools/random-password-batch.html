<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerador de Várias Senhas | Oolivo</title><meta name="description" content="Gere várias senhas aleatórias no navegador com a ferramenta gratuita da Oolivo."><meta name="robots" content="index,follow"><link rel="canonical" href="https://oolivo.com.br/tools/random-password-batch.html"><link rel="stylesheet" href="/styles.css"></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">O</span><span>Oolivo</span></a><nav><a href="/">Ferramentas</a></nav></header><main class="tool-page"><div class="breadcrumbs"><a href="/">Início</a> / Gerador de Senhas em Lote</div><h1>Gerador de Várias Senhas</h1><p class="intro">Gere várias senhas aleatórias com letras, números e símbolos.</p><div class="tool-box"><label>Quantidade (1 a 50) <input id="count" type="number" min="1" max="50" value="10"></label><label>Comprimento (8 a 64) <input id="length" type="number" min="8" max="64" value="16"></label><button class="btn" onclick="run()">Gerar senhas</button><div id="result" class="result">As senhas aparecerão aqui.</div></div><section class="info"><h2>Sobre esta ferramenta</h2><p>Use senhas exclusivas para cada serviço e guarde-as em um gerenciador de senhas confiável.</p></section></main><script>function run(){const count=Number(document.getElementById('count').value),len=Number(document.getElementById('length').value),out=document.getElementById('result');if(!Number.isInteger(count)||count<1||count>50||!Number.isInteger(len)||len<8||len>64){out.textContent='Informe quantidade entre 1 e 50 e comprimento entre 8 e 64.';return;}const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*+-_';const list=[];for(let i=0;i<count;i++){const bytes=new Uint32Array(len);crypto.getRandomValues(bytes);list.push(Array.from(bytes,n=>chars[n%chars.length]).join(''));}out.textContent=list.join('\n')}</script></body></html>
