<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Oolivo — Confirmar acesso</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#0b0b0d;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}.box{width:min(620px,100%);background:#151519;border:1px solid #333;border-radius:20px;padding:32px}h1{font-size:28px;margin-top:0}p{line-height:1.6;color:#ddd}code{background:#09090b;padding:4px 7px;border-radius:6px;overflow-wrap:anywhere}a,button{display:inline-block;padding:13px 18px;border-radius:10px;background:#fff;color:#000;text-decoration:none;font-weight:700;border:0;cursor:pointer}.cred{background:#0b0b0d;border:1px solid #333;padding:16px;border-radius:12px;margin:18px 0}.muted{color:#aaa}.error{color:#ffaaaa}.ok{color:#7dff9a}.actions{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<main class="box">
<h1 id="heading">Validando pagamento…</h1>
<p id="intro">Estamos confirmando a compra com segurança. Não feche esta página.</p>
<div id="out" role="status" aria-live="polite">Aguarde enquanto verificamos a sessão da Stripe.</div>
</main>
<script>
(async()=>{
 const out=document.getElementById("out");
 const heading=document.getElementById("heading");
 const intro=document.getElementById("intro");
 const sid=new URLSearchParams(location.search).get("session_id");
 if(!sid){
   heading.textContent="Não encontramos a sessão de pagamento";
   intro.textContent="Esta página precisa ser aberta pelo redirecionamento após o Checkout da Stripe.";
   out.textContent="Volte à página do produto e conclua o Checkout. Não é necessário fazer outra cobrança se você já pagou; abra o link de confirmação recebido após o pagamento.";
   return;
 }
 try{
   const r=await fetch("/api/activate-account",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({session_id:sid})});
   let j={};try{j=await r.json()}catch{}
   if(!r.ok||!j.ok){
     heading.textContent="Não foi possível liberar o acesso";
     intro.textContent="A confirmação não foi concluída.";
     out.className="error";
     out.textContent=j.error||"Não foi possível validar o pagamento. Aguarde um instante e tente novamente.";
     const retry=document.createElement("button");retry.textContent="Tentar novamente";retry.onclick=()=>location.reload();
     out.appendChild(document.createElement("br"));out.appendChild(document.createElement("br"));out.appendChild(retry);
     return;
   }
   heading.textContent="Acesso liberado!";
   intro.textContent="A confirmação do pagamento foi validada.";
   out.replaceChildren();
   const msg=document.createElement("p");msg.className="ok";msg.textContent="Sua conta está pronta.";out.appendChild(msg);
   if(j.user&&j.user.email){const email=document.createElement("p");email.append("E-mail: ");const code=document.createElement("code");code.textContent=j.user.email;email.appendChild(code);out.appendChild(email);}
   if(j.generatedPassword){
     const cred=document.createElement("div");cred.className="cred";
     const label=document.createElement("p");label.textContent="Senha inicial (guarde em local seguro):";cred.appendChild(label);
     const code=document.createElement("code");code.textContent=j.generatedPassword;cred.appendChild(code);
     const note=document.createElement("p");note.className="muted";note.textContent="Depois de entrar, altere sua senha nas configurações.";cred.appendChild(note);out.appendChild(cred);
   }
   const mail=document.createElement("p");mail.className=j.emailSent?"ok":"error";
   mail.textContent=j.emailSent?"✓ As credenciais foram enviadas por e-mail.":(j.generatedPassword?"Atenção: não conseguimos enviar o e-mail. "+(j.emailError||"Verifique a configuração do envio de e-mail."):"Se você já tinha uma conta, entre com suas credenciais existentes.");
   out.appendChild(mail);
   const actions=document.createElement("div");actions.className="actions";
   const link=document.createElement("a");link.href="/account.html";link.textContent="Entrar no meu painel";actions.appendChild(link);out.appendChild(actions);
 }catch(e){
   heading.textContent="Falha de comunicação";
   intro.textContent="Não conseguimos concluir a validação agora.";
   out.className="error";
   out.textContent="Verifique sua conexão e tente novamente. Se o pagamento já foi concluído, não pague novamente.";
   const retry=document.createElement("button");retry.textContent="Tentar novamente";retry.onclick=()=>location.reload();out.appendChild(document.createElement("br"));out.appendChild(document.createElement("br"));out.appendChild(retry);
 }
})();
</script>
</body>
</html>
