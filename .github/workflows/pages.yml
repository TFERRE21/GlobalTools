name: Deploy Oolivo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workbook engine
        run: python -m pip install --upgrade openpyxl

      - name: Build PRO finance workbook
        run: |
          cat scripts/build_finance_dashboard.01.py scripts/build_finance_dashboard.02.py scripts/build_finance_dashboard.03.py > /tmp/build_finance_dashboard.py
          python /tmp/build_finance_dashboard.py

      - name: Publish PRO workbook
        uses: EndBug/add-and-commit@v9
        with:
          add: "products/GlobalTools-Small-Business-Finance-Dashboard-PRO.xlsx"
          message: "Build PRO finance workbook"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
