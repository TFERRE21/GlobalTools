name: Validate Oolivo SEO robot

on:
  push:
    branches: [main]
    paths:
      - "scripts/seo-robot.js"
      - "scripts/seo-worker.js"
      - ".github/workflows/seo-robot.yml"
      - "gateway.js"
  pull_request:
    branches: [main]
    paths:
      - "scripts/seo-robot.js"
      - "scripts/seo-worker.js"
      - ".github/workflows/seo-robot.yml"
      - "gateway.js"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate syntax
        run: |
          node --check scripts/seo-robot.js
          node --check scripts/seo-worker.js
          node --check gateway.js
