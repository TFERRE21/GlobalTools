name: Oolivo SEO Discovery Robot

on:
  schedule:
    # 08:30 in Brasília (UTC-3); GitHub may delay scheduled starts slightly.
    - cron: "30 11 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/seo-robot.js"
      - ".github/workflows/seo-robot.yml"

permissions:
  contents: write

concurrency:
  group: oolivo-seo-robot
  cancel-in-progress: false

jobs:
  discover-and-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run keyword discovery and sitemap builder
        run: node scripts/seo-robot.js
      - name: Commit updated sitemap and keyword ideas
        run: |
          git config user.name "Oolivo SEO Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml seo/keyword-opportunities.json
          if git diff --cached --quiet; then
            echo "No SEO changes to commit."
          else
            git commit -m "Update SEO sitemap and keyword ideas [skip ci]"
            git push
          fi
